[package]
name = "vigil-core"
description = "Domain types, processing pipeline and diffing for Vigil. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
encoding_rs = "0.8.42"
html2text = "0.17.4"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.0"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["serde"] }

[dev-dependencies]
insta = "1.49.0"
serde_json = "1.0.154"
