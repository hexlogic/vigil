<tr id="watch-{{ row.id }}">
<td colspan="6">
<div class="row">
<span class="grow">{{ ctx.t1("watches.delete.confirm", "name", row.name) }}</span>
<span class="actions">
<button class="btn btn-small btn-danger" type="button" hx-post="{{ row.delete_url }}" hx-target="#watch-{{ row.id }}" hx-swap="outerHTML">{{ ctx.t("watches.delete.yes") }}</button>
<button class="btn btn-small" type="button" hx-get="{{ row.row_url }}" hx-target="#watch-{{ row.id }}" hx-swap="outerHTML">{{ ctx.t("watches.delete.no") }}</button>
</span>
</div>
</td>
</tr>
