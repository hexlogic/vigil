[package]
name = "vigil-core"
description = "Domain types, processing pipeline and diffing for Vigil. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
ego-tree = "0.11"
encoding_rs = "0.8.42"
feed-rs = "3.0.0"
html2text = "0.17.4"
jaq-core = "3.1.1"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.3"
regex = "1.13.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_json_path = "0.7.2"
similar = "3.2.0"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["serde"] }

[dev-dependencies]
insta = "1.49.0"
