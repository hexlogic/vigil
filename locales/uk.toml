# Текст інтерфейсу. Кожен рядок, який бачить користувач вебінтерфейсу, зберігається тут,
# а не в шаблоні чи в коді Rust. Підстановки пишуться як {name}. Лічильні форми мають окремі
# ключі: key.one, key.few, key.many, key.other. Набір ключів має збігатися з en.toml.

