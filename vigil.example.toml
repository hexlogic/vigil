# Copy to vigil.toml. Every key is optional; VIGIL_* environment variables override this file.

listen = "0.0.0.0:5800"
data_dir = "data"
# base_url = "https://vigil.example.com" # where Vigil is reached; notifications link to diff pages with it
log_format = "text" # "text" or "json"
# admin_password = "..."  # prefer the VIGIL_ADMIN_PASSWORD environment variable; unset: one is made up and logged once
# no_auth = true          # skip the sign-in; trusted networks only (see docs/configuration.md)

[fetch]
timeout_secs = 30
max_body_bytes = 10485760 # 10 MiB, after decompression
# user_agent = "vigil/0.1.0"

[scheduler]
concurrency = 8 # checks at once
per_host = 2    # checks at once against one host

[import]
max_upload_bytes = 268435456 # 256 MiB: the largest file the web UI and the API take for an import
