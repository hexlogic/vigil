name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path crates/vigil-core/fuzz/Cargo.toml -- --check

  check:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Runs the pipeline fuzz target for a minute. `cargo +nightly` overrides the toolchain
  # pinned in rust-toolchain.toml; the fuzz crate is its own workspace, so nothing above
  # builds it.
  fuzz:
    name: fuzz the pipeline (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/vigil-core/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz
        working-directory: crates/vigil-core
        run: |
          mkdir -p fuzz/corpus/pipeline_html
          cargo +nightly fuzz run pipeline_html fuzz/corpus/pipeline_html tests/fixtures -- \
            -max_total_time=60 -max_len=16384 -rss_limit_mb=2048
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/vigil-core/fuzz/artifacts
