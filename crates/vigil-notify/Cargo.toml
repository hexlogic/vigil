[package]
name = "vigil-notify"
description = "Notification channels and templating for Vigil."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
humantime = "2.4.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
minijinja = { version = "3.0.1", default-features = false, features = ["builtins", "fuel"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
insta = "1.49.0"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net", "io-util"] }
wiremock = "0.6.5"
