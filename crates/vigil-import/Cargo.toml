[package]
name = "vigil-import"
description = "Reads watches from URL lists, OPML and other tools' exports, and reports what it could not carry over."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
quick-xml = "0.42.0"
regex = "1.13.1"
serde_json = "1.0.154"
thiserror = "2.0.21"
vigil-core = { version = "0.1.0", path = "../vigil-core" }
vigil-fetch = { version = "0.1.0", path = "../vigil-fetch" }
vigil-notify = { version = "0.1.0", path = "../vigil-notify" }
vigil-store = { version = "0.1.0", path = "../vigil-store" }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
uuid = "1.28.0"
