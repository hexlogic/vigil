# Текст інтерфейсу. Кожен рядок, який бачить користувач вебінтерфейсу, зберігається тут,
# а не в шаблоні чи в коді Rust. Підстановки пишуться як {name}. Лічильні форми мають окремі
# ключі: key.one, key.few, key.many, key.other. Набір ключів має збігатися з en.toml.

[layout]
skip = "Перейти до вмісту"
main_menu = "Головне меню"
no_auth_warning = "Вхід вимкнено. Будь-хто, хто має доступ до цієї адреси, може змінювати ваші відстеження та цілі сповіщень."
version = "Vigil {version}"

[nav]
watches = "Відстеження"
notifications = "Сповіщення"
tags = "Мітки"
settings = "Налаштування"
sign_out = "Вийти"

[error]
not_found_title = "Сторінку не знайдено"
not_found_body = "За цією адресою нічого немає."
forbidden_title = "Запит відхилено"
forbidden_body = "Цей запит надійшов не з цього сайту, тому його не виконано. Перезавантажте сторінку та спробуйте ще раз."
host_title = "Адреса не дозволена"
host_body = "Вхід вимкнено, тому Vigil відповідає лише за IP-адресою, на localhost або за адресою, заданою як base_url. Відкрийте його одним із цих способів або увімкніть вхід."
server_title = "Щось пішло не так"
server_body = "Не вдалося виконати запит. Подробиці є в журналі сервера."
back_to_watches = "Назад до відстежень"

[watches]
title = "Відстеження"
empty = "Відстежень ще немає."
count.one = "{n} відстеження"
count.few = "{n} відстеження"
count.many = "{n} відстежень"
count.other = "{n} відстеження"

[login]
title = "Вхід"
password = "Пароль"
submit = "Увійти"
wrong = "Неправильний пароль."
too_many = "Забагато неправильних паролів. Зачекайте хвилину й спробуйте ще раз."
