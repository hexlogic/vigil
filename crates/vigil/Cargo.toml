[package]
name = "vigil"
description = "Vigil: self-hosted website change detection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
vigil-core = { version = "0.1.0", path = "../vigil-core" }
vigil-import = { version = "0.1.0", path = "../vigil-import" }
vigil-fetch = { version = "0.1.0", path = "../vigil-fetch" }
vigil-notify = { version = "0.1.0", path = "../vigil-notify" }
vigil-scheduler = { version = "0.1.0", path = "../vigil-scheduler" }
vigil-store = { version = "0.1.0", path = "../vigil-store" }
vigil-web = { version = "0.1.0", path = "../vigil-web" }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
wiremock = "0.6.5"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
