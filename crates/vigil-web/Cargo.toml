[package]
name = "vigil-web"
description = "REST API and web UI for Vigil."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
askama = { version = "0.16.1", default-features = false, features = ["derive", "std", "urlencode"] }
axum = "0.8.9"
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
thiserror = "2.0.21"
toml = "0.8.23"
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "compression-br", "set-header", "timeout"] }
tracing = "0.1.44"
vigil-store = { version = "0.1.0", path = "../vigil-store" }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
vigil-core = { version = "0.1.0", path = "../vigil-core" }
