[package]
name = "vigil-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# `cargo fuzz` needs nightly and the fuzz macro generates `#[no_mangle]` items, so this crate
# is its own workspace and does not inherit the workspace lints (`unsafe_code = "forbid"`).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
vigil-core = { path = ".." }

[[bin]]
name = "pipeline_html"
path = "fuzz_targets/pipeline_html.rs"
test = false
doc = false
bench = false
