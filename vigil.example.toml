# Copy to vigil.toml. Every key is optional; VIGIL_* environment variables override this file.

listen = "0.0.0.0:5800"
data_dir = "data"
log_format = "text" # "text" or "json"

[fetch]
timeout_secs = 30
max_body_bytes = 10485760 # 10 MiB, after decompression
# user_agent = "vigil/0.1.0"

[scheduler]
concurrency = 8 # checks at once
per_host = 2    # checks at once against one host
