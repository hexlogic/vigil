[package]
name = "vigil-web"
description = "REST API and web UI for Vigil."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std", "urlencode"] }
axum = { version = "0.8.9", features = ["multipart"] }
blake3 = "1.8.7"
getrandom = "0.4.3"
http-body-util = "0.1.5"
humantime = "2.4.0"
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt", "sync", "time", "fs", "io-util"] }
toml = "0.8.23"
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "compression-br", "set-header", "timeout"] }
tracing = "0.1.44"
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-axum = "0.3.0"
uuid = "1.28.0"
vigil-core = { version = "0.1.0", path = "../vigil-core", features = ["openapi"] }
vigil-import = { version = "0.1.0", path = "../vigil-import", features = ["openapi"] }
vigil-fetch = { version = "0.1.0", path = "../vigil-fetch" }
vigil-notify = { version = "0.1.0", path = "../vigil-notify" }
vigil-scheduler = { version = "0.1.0", path = "../vigil-scheduler" }
vigil-store = { version = "0.1.0", path = "../vigil-store" }

[dev-dependencies]
futures-util = "0.3.31"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
